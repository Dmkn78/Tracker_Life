name: Build and deploy Interface to Windows IIS

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: interface-production
  cancel-in-progress: false

jobs:
  build-static-export:
    name: Build and validate static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify static-export contract
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq "output[[:space:]]*:[[:space:]]*['\"]export['\"]" next.config.ts; then
            echo "::error::This workflow deploys only a static Next.js export. Add output: 'export' after migrating server-backed features out of the Next.js runtime."
            exit 1
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API test dependencies
        run: python -m pip install --disable-pip-version-check -r interface_API/requirements.txt

      - name: Type-check
        run: pnpm typecheck

      - name: Run domain tests
        run: |
          pnpm test:appearance
          pnpm test:todo
          pnpm test:habits
          pnpm test:daily-log
          pnpm test:emotional
          pnpm test:calendar
          pnpm test:time-allocation

      - name: Run API tests
        working-directory: interface_API
        run: python -m unittest discover -s tests -v

      - name: Build static export
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/life_regime_tracker?schema=public
        run: pnpm build

      - name: Validate exported files
        shell: bash
        run: |
          set -euo pipefail
          test -d out
          test -s out/index.html
          file_count="$(find out -type f | wc -l)"
          if [ "$file_count" -lt 1 ]; then
            echo "::error::The out directory is empty."
            exit 1
          fi
          echo "Validated static export: ${file_count} files"

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: interface-static-${{ github.sha }}
          path: out
          if-no-files-found: error
          retention-days: 14

  deploy-iis:
    name: Deploy validated artifact to IIS
    needs: build-static-export
    runs-on: [self-hosted, windows, x64, iis-interface]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/deploy-iis.ps1
          sparse-checkout-cone-mode: false

      - name: Download static artifact
        uses: actions/download-artifact@v4
        with:
          name: interface-static-${{ github.sha }}
          path: ${{ runner.temp }}\interface-static

      - name: Deploy and verify IIS
        shell: pwsh
        env:
          IIS_SITE_NAME: ${{ vars.IIS_SITE_NAME }}
          IIS_DEPLOY_ROOT: ${{ vars.IIS_DEPLOY_ROOT }}
          IIS_HEALTH_URL: ${{ vars.IIS_HEALTH_URL }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('IIS_SITE_NAME', 'IIS_DEPLOY_ROOT', 'IIS_HEALTH_URL')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing production environment variable: $name"
            }
          }

          $artifactPath = Join-Path $env:RUNNER_TEMP 'interface-static'
          & "$env:GITHUB_WORKSPACE\scripts\deploy-iis.ps1" `
            -SiteName $env:IIS_SITE_NAME `
            -ArtifactPath $artifactPath `
            -DeployRoot $env:IIS_DEPLOY_ROOT `
            -ReleaseId $env:RELEASE_ID `
            -HealthUrl $env:IIS_HEALTH_URL

          if ($LASTEXITCODE -ne 0) {
            throw "IIS deployment script failed with exit code $LASTEXITCODE"
          }
