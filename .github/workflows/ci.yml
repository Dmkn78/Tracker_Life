name: Validate Life Regime

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev_branch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Web, mobile and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: life_regime_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d life_regime_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/life_regime_ci?schema=public
      ENV: test
      RUN_DATABASE_TESTS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: interface_API/requirements.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check -r interface_API/requirements.txt
      - name: Create isolated test database schema
        run: |
          pnpm prisma:generate
          pnpm exec prisma migrate deploy
      - name: Type-check web and mobile
        run: |
          pnpm typecheck
          pnpm exec tsc -p tsconfig.mobile.json --noEmit
      - name: Run domain and mobile tests
        run: |
          pnpm test:appearance
          pnpm test:todo
          pnpm test:habits
          pnpm test:daily-log
          pnpm test:assistant
          pnpm test:emotional
          pnpm test:calendar
          pnpm test:time-allocation
          pnpm test:mobile
          node --test scripts/package-android-release.test.mjs
          python -m unittest discover -s scripts -p test_verify_mobile_publication.py -v
          bash -n scripts/deploy.sh
      - name: Run API tests including PostgreSQL integration
        working-directory: interface_API
        run: python -m unittest discover -s tests -v
      - name: Run audio segmentation tests
        run: python -m unittest discover -s services/tests -v
      - name: Build web and mobile
        run: pnpm build
      - name: Validate Android project synchronization
        run: pnpm exec cap sync android
      - name: Run Android unit tests
        working-directory: android
        run: bash gradlew --no-daemon :app:testDebugUnitTest

  publish-android:
    name: Publish signed Android update
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev_branch')
    permissions:
      contents: write
    uses: ./.github/workflows/android-release.yml
    secrets: inherit

  deploy-vps:
    name: Deploy to VPS
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare SSH credentials
        run: |
          set -euo pipefail
          for var in VPS_SSH_KEY VPS_SSH_HOST_KEY VPS_HOST VPS_USER; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Required GitHub secret $var is not set"
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/vps_deploy"
          chmod 600 "$HOME/.ssh/vps_deploy"
          printf '%s\n' "$VPS_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Run deploy.sh on VPS
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/vps_deploy" \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "$VPS_USER@$VPS_HOST" \
            "cd /opt/interface_API && bash scripts/deploy.sh $GITHUB_SHA"

      - name: Public health check
        run: |
          set -euo pipefail
          curl -fsSk --max-time 30 "https://$VPS_HOST/api/health"
          curl -fsSk -o /dev/null --max-time 30 "https://$VPS_HOST/"
